<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Tempest | Abdelwahab</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Inter:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#020204;color:#e0e0e0;font-family:'Inter',sans-serif;height:100vh;overflow:hidden}
canvas{position:fixed;top:0;left:0;z-index:0}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5;transition:opacity 0.08s}
.top-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;justify-content:center;gap:2rem;padding:1.2rem;background:rgba(2,2,4,0.6);backdrop-filter:blur(12px);border-bottom:1px solid rgba(0,212,255,0.15)}
.top-nav a{color:#888;text-decoration:none;font-family:'Cinzel Decorative',cursive;font-size:0.8rem;letter-spacing:0.15em;transition:all 0.3s;text-transform:uppercase}
.top-nav a:hover,.top-nav a.active{color:#00d4ff;text-shadow:0 0 15px rgba(0,212,255,0.8)}
.content{position:relative;z-index:10;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem}
h1{font-family:'Cinzel Decorative',cursive;font-size:clamp(2.2rem,7vw,6rem);font-weight:900;color:#fff;letter-spacing:0.12em;text-shadow:0 0 40px rgba(0,212,255,0.5);display:flex;gap:0.08em;white-space:nowrap}
h1 span{display:inline-block;opacity:0;transform:translateY(40px);animation:dropIn 0.7s ease-out forwards}
h1 span:nth-child(1){animation-delay:0.4s}h1 span:nth-child(2){animation-delay:0.5s}h1 span:nth-child(3){animation-delay:0.6s}
h1 span:nth-child(4){animation-delay:0.7s}h1 span:nth-child(5){animation-delay:0.8s}h1 span:nth-child(6){animation-delay:0.9s}
h1 span:nth-child(7){animation-delay:1.0s}h1 span:nth-child(8){animation-delay:1.1s}h1 span:nth-child(9){animation-delay:1.2s}
h1 span:nth-child(10){animation-delay:1.3s}
h1 span:hover{color:#ffd700;text-shadow:0 0 30px #ffd700;transform:scale(1.15);transition:0.3s;cursor:default}
@keyframes dropIn{to{opacity:1;transform:translateY(0)}}
.subtitle{font-size:1rem;letter-spacing:0.5em;text-transform:uppercase;color:#00d4ff;margin-top:1.5rem;opacity:0;animation:fadeIn 2s ease-out forwards;animation-delay:2.2s}
.nav{margin-top:3rem;display:flex;gap:1.2rem;opacity:0;animation:fadeIn 2s ease-out forwards;animation-delay:3.2s;flex-wrap:wrap;justify-content:center}
.nav a{color:#fff;text-decoration:none;font-family:'Cinzel Decorative',cursive;font-size:0.85rem;padding:0.8rem 1.6rem;border:1px solid rgba(0,212,255,0.25);background:rgba(0,212,255,0.04);transition:all 0.4s;position:relative;overflow:hidden;text-transform:uppercase;letter-spacing:0.1em}
.nav a:hover{background:rgba(0,212,255,0.2);border-color:#00d4ff;box-shadow:0 0 25px rgba(0,212,255,0.4);transform:translateY(-2px)}
.nav a::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.15),transparent);transition:left 0.6s}
.nav a:hover::before{left:100%}
@keyframes fadeIn{to{opacity:1}}
.fog{position:fixed;inset:0;z-index:1;background:radial-gradient(circle at 50% 50%,transparent 0%,rgba(2,2,4,0.85) 100%);pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="flash" id="f"></div>
<div class="fog"></div>
<nav class="top-nav">
  <a href="index.html" class="active">The Tempest</a>
  <a href="puzzles.html">The Trials</a>
  <a href="message.html">The Message</a>
  <a href="final.html">The Calm</a>
</nav>
<div class="content">
  <h1>
    <span>A</span><span>B</span><span>D</span><span>E</span><span>L</span>
    <span>W</span><span>A</span><span>H</span><span>A</span><span>B</span>
  </h1>
  <div class="subtitle">The Storm Celebrates You</div>
  <div class="nav">
    <a href="puzzles.html" onclick="return go(event,'puzzles.html')">Enter The Trials</a>
    <a href="message.html" onclick="return go(event,'message.html')">Read The Message</a>
  </div>
</div>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
let w,h;
function resize(){w=c.width=innerWidth;h=c.height=innerHeight}
addEventListener('resize',resize);resize();
const drops=Array.from({length:500},()=>({x:Math.random()*w,y:Math.random()*h,l:Math.random()*30+10,s:Math.random()*14+16,o:Math.random()*0.4+0.1}));
let bolts=[],flash=0;
function bolt(){const sx=Math.random()*w,segs=[];let cx=sx,cy=0;for(let i=0;i<12;i++){cx+=(Math.random()-0.5)*140;cy+=Math.random()*90+40;segs.push({x:cx,y:Math.min(cy,h)})}return{segs,life:14,op:1}}
function draw(){
  x.fillStyle='rgba(2,2,4,0.22)';x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(160,180,220,0.3)';x.lineWidth=1;x.beginPath();
  for(let d of drops){x.moveTo(d.x,d.y);x.lineTo(d.x-2,d.y+d.l);d.y+=d.s;d.x-=1.5;if(d.y>h){d.y=-d.l;d.x=Math.random()*w}}x.stroke();
  if(Math.random()<0.012)bolts.push(bolt());
  for(let i=bolts.length-1;i>=0;i--){const b=bolts[i];x.shadowBlur=30;x.shadowColor='rgba(200,230,255,0.9)';x.strokeStyle=`rgba(255,255,255,${b.op})`;x.lineWidth=2+Math.random()*2;x.beginPath();x.moveTo(b.segs[0].x,0);for(let s of b.segs)x.lineTo(s.x,s.y);x.stroke();x.shadowBlur=0;b.life--;b.op-=0.07;if(b.life<=0){bolts.splice(i,1);flash=0.35}}
  if(flash>0){document.getElementById('f').style.opacity=flash;flash-=0.03}else{document.getElementById('f').style.opacity=0}
  requestAnimationFrame(draw);
}
draw();
function go(e,url){e.preventDefault();document.body.style.transition='opacity 1.2s ease-in';document.body.style.opacity=0;setTimeout(()=>location.href=url,1200);return false}
</script>
</body>
</html>
